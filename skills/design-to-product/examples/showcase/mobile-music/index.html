<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rill — listening room</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;font:17px/1.5 Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:5px}button{cursor:pointer;min-height:48px;padding:12px 20px;border:0;font-weight:700}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,p{margin-top:0}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 5vw}header strong{font-size:24px}footer{padding:24px 5vw;font-size:14px}.notice{padding:16px;border:2px solid currentColor;margin-top:20px}.notice:empty{display:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid currentColor}svg{max-width:100%}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

0 600 600" role="img" aria-label="Original abstract album artwork: black discs crossing a rose field"><rect width="600" height="600" fill="#ff8cb6"/><g fill="#171717"><circle cx="100" cy="125" r="170"/><circle cx="500" cy="480" r="230"/></g><g fill="none" stroke="#ff8cb6" stroke-width="2"><circle cx="500" cy="480" r="180"/><circle cx="500" cy="480" r="150"/><circle cx="500" cy="480" r="120"/></g><path d="M0 380L600 100V165L0 445Z" fill="#fff4f5"/></svg><div class="album-caption"><span>Original cover study</span><span>Rill sessions / 04</span></div></section><section class="player"><p class="label">Evening collection</p><h1>Soft edges.<br>Slow streets.</h1><p>Three tracks for the way home.</p><div class="now"><div><h2 id="track-title">Window seat</h2><p id="artist">Mira / 3:42</p></div><button id="save" aria-pressed="false" aria-label="Save Window seat">＋</button></div><div class="progress"><span></span></div><div class="transport"><button id="previous" aria-label="Previous track">←</button><button id="play">Play</button><button id="next" aria-label="Next track">→</button></div><p id="result" role="status" class="notice"></p><div class="tracklist"><button data-track="0"><span>Window seat</span><span>3:42</span></button><button data-track="1"><span>After the rain</span><span>4:08</span></button><button data-track="2"><span>Side streets</span><span>2:56</span></button></div><p class="disclosure">Local interface study. No licensed audio is bundled.</p></section></main><footer>Rill / Original listening study</footer><script>const tracks=[['Window seat','Mira / 3:42'],['After the rain','Mira / 4:08'],['Side streets','Mira / 2:56']];let current=0;const saved=new Set();function render(){document.querySelector('#track-title').textContent=tracks[current][0];document.querySelector('#artist').textContent=tracks[current][1];document.querySelector('#save').setAttribute('aria-label',(saved.has(current)?'Unsave ':'Save ')+tracks[current][0]);document.querySelector('#save').setAttribute('aria-pressed',saved.has(current));document.querySelector('#save').textContent=saved.has(current)?'✓':'＋';document.querySelectorAll('[data-track]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.track)===current));}document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.track);render();});document.querySelector('#next').onclick=()=>{current=(current+1)%tracks.length;render();};document.querySelector('#previous').onclick=()=>{current=(current+2)%tracks.length;render();};document.querySelector('#save').onclick=()=>{saved.has(current)?saved.delete(current):saved.add(current);document.querySelector('#result').textContent=saved.size+' track'+(saved.size===1?'':'s')+' saved in this local session.';render();};document.querySelector('#play').onclick=()=>document.querySelector('#result').textContent='Audio unavailable: this study contains no music files. You can still choose and save tracks locally.';render();</script></body></html>
