<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readable utility fixture</title><style>body{margin:24px;background:#fff;color:#152a30;font:18px/1.5 Arial,sans-serif}main{max-width:600px}h1{font-size:30px}label{display:block}input,button{min-height:48px;font:inherit;padding:8px;box-sizing:border-box;max-width:100%}button{background:#152a30;color:#fff}button:disabled{background:#fff;color:#ddd}input{display:block;width:100%}button:focus-visible,input:focus-visible{outline:3px solid #006a84;outline-offset:4px}</style></head><body><main><h1>Find an appointment</h1><p>A task-focused interface without marketing images or animation.</p><label for="date">Preferred date</label><input id="date" type="date"><button type="button">Show available dates</button><button disabled>Unavailable action</button></main></body></html>
